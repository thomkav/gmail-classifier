version: '3'

# Gmail Classifier — task CLI workflows
# Run `task --list` for the menu. All targets that touch IMAP source ~/.zsh_secrets
# (which exports GMAIL_APP_PASSWORD).

vars:
  ROOT:
    sh: pwd
  SCRIPTS: '{{.ROOT}}/scripts'
  WEB: '{{.ROOT}}/web'

env:
  PYTHONUNBUFFERED: '1'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  # ── Web app (primary interface) ───────────────────────────────────────────

  web:install:
    desc: Install frontend deps
    dir: '{{.WEB}}/frontend'
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  web:api:
    desc: Run the FastAPI backend on :45100 (autoreload)
    dir: '{{.WEB}}/api'
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && uvicorn main:app --reload --port 45100

  web:frontend:
    desc: Run the Vite dev server on :45101
    dir: '{{.WEB}}/frontend'
    cmds:
      - npm run dev

  web:
    desc: Run API + frontend in parallel (Ctrl-C to stop both)
    deps: [web:install]
    cmds:
      - |
        source ~/.zsh_secrets 2>/dev/null
        (cd {{.WEB}}/api && uvicorn main:app --reload --port 45100) &
        API=$!
        (cd {{.WEB}}/frontend && npm run dev) &
        FE=$!
        trap "kill $API $FE 2>/dev/null" EXIT
        wait

  web:build:
    desc: Production build of the frontend
    dir: '{{.WEB}}/frontend'
    cmds:
      - npm run build

  # ── Database / cache (T2+) ────────────────────────────────────────────────

  db:migrate:
    desc: Apply SQLite schema migrations
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.WEB}}/api/db.py migrate

  db:reset:
    desc: Wipe and recreate the SQLite cache (DESTRUCTIVE)
    prompt: This will delete data/gmail_classifier.sqlite. Continue?
    cmds:
      - rm -f {{.ROOT}}/data/gmail_classifier.sqlite
      - task: db:migrate

  # ── CLI utilities (still useful for scripted/one-off work) ────────────────

  audit:quick:
    desc: JSON snapshot of unread senders (no UI, no actions)
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/sender_audit.py

  audit:all:
    desc: JSON snapshot of ALL inbox mail (read + unread)
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/sender_audit.py --all

  auto-archive:dry-run:
    desc: Preview the auto-archive plan (no changes)
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/auto_archive.py --dry-run

  auto-archive:apply:
    desc: Apply the auto-archive plan
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/auto_archive.py --apply

  recidivists:
    desc: Report domains that ignored unsubscribe and are still emailing
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/recidivist_check.py

  sweep:dry-run:
    desc: Find blocked-list domains still slipping into inbox (preview)
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/sweep_blocked.py

  sweep:apply:
    desc: Sweep blocked-list domains out of the inbox
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/sweep_blocked.py --apply

  batch-archive:dry-run:
    desc: Dry-run mass archive from a domain list file (FILE=path/to/file.txt)
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/batch_archive.py {{.FILE}}
    requires:
      vars: [FILE]

  batch-archive:apply:
    desc: Apply mass archive from a domain list file (FILE=path/to/file.txt)
    cmds:
      - source ~/.zsh_secrets 2>/dev/null && python3 {{.SCRIPTS}}/batch_archive.py {{.FILE}} --apply
    requires:
      vars: [FILE]

  # ── Deprecated (replaced by web app) ──────────────────────────────────────

  deprecated:audit-email:
    desc: '[DEPRECATED] Interactive TUI audit — use `task web` instead'
    cmds:
      - echo "DEPRECATED — please use \`task web\` for the web interface."
      - echo "If you really need the TUI, run python3 {{.SCRIPTS}}/inbox_audit.py directly."
      - exit 1
